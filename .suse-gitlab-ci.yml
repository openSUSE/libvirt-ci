variables:
  GIT_STRATEGY: none
  PACKAGE_WORKSPACE: "/var/tmp"

stages:
  - build
  - deploy
  - test


# Per-stage job templates. Distro-specific values come from the distro
# templates below via job-level variables.
.distro-job:
  tags:
    - $DISTRO
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ $BRANCH_RE
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ $BRANCH_RE

.build:
  extends: .distro-job
  stage: build
  script:
    - echo "Starting build stage for $LABEL"
    - /root/bin/wait-for-publish.sh api.suse.de $OBS_PROJECT libvirt $OBS_REPO x86_64
    - echo "Build stage finished"

.deploy:
  extends: .distro-job
  stage: deploy
  script:
    - echo "Starting deploy stage for $LABEL"
    - "RMT_PROJECT=$(echo \"$OBS_PROJECT\" | sed 's|:|:/|g')"
    - /root/bin/deploy.sh virt_staging_repo "http://rmt/repo/ibs/$RMT_PROJECT/$OBS_REPO/"
    - echo "Deploy stage finished"

.test:
  extends: .distro-job
  stage: test
  script:
    - echo "Starting test stage for $LABEL"
    - /root/bin/run-test.sh
    - echo "Test stage finished"


# To add a distro, copy one block below and edit it.
#   DISTRO:      runner tag
#   LABEL:       name used in log messages
#   OBS_PROJECT: OBS staging project
#   OBS_REPO:    OBS repository name
#   BRANCH_RE:   regex matching the distro's branches
.sle15sp5:
  variables:
    DISTRO: sle15sp5
    LABEL: "SLE15 SP5"
    OBS_PROJECT: Devel:Virt:SLE-15-SP5:Staging
    OBS_REPO: SUSE_SLE-15-SP5_Update_standard
    BRANCH_RE: /.*-sle15sp5/

build_sle15sp5:
  extends: [.build, .sle15sp5]
deploy_sle15sp5:
  extends: [.deploy, .sle15sp5]
test_sle15sp5:
  extends: [.test, .sle15sp5]


